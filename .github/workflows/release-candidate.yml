name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version without a v prefix
        required: true
        type: string
      commit_sha:
        description: Full lowercase commit SHA from the default branch
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  preflight:
    name: Validate candidate source
    runs-on: ubuntu-latest
    steps:
      - name: Validate identity, ancestry, checks, and publication absence
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "version must be a stable semantic version without a v prefix" >&2
            exit 1
          fi

          resolved=$(gh api "repos/$REPOSITORY/commits/$COMMIT_SHA" --jq .sha)
          if [[ "$resolved" != "$COMMIT_SHA" ]]; then
            echo "commit_sha did not resolve to the supplied commit" >&2
            exit 1
          fi

          default_branch=$(gh api "repos/$REPOSITORY" --jq .default_branch)
          if [[ "$default_branch" != "main" ]]; then
            echo "The repository default branch must be main" >&2
            exit 1
          fi
          ancestry=$(gh api "repos/$REPOSITORY/compare/$COMMIT_SHA...$default_branch" --jq .status)
          if [[ "$ancestry" != "ahead" && "$ancestry" != "identical" ]]; then
            echo "commit_sha must be reachable from the default branch" >&2
            exit 1
          fi

          ci_runs="$RUNNER_TEMP/ci-runs.json"
          gh api --paginate --slurp --method GET "repos/$REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$COMMIT_SHA" -f event=push -f status=success -f per_page=100 > "$ci_runs"
          if ! jq -e --arg sha "$COMMIT_SHA" '
            [.[] | .workflow_runs[] |
              select(.head_sha == $sha and .event == "push" and .status == "completed" and .conclusion == "success")]
            | length > 0
          ' "$ci_runs" >/dev/null; then
            echo "No successful push CI run exists for commit_sha" >&2
            exit 1
          fi

          tag="v$RELEASE_VERSION"
          check_absent() {
            endpoint=$1
            label=$2
            response=""
            if response=$(gh api --include --silent "$endpoint"); then
              echo "$label already exists" >&2
              exit 1
            fi
            case "$response" in
              HTTP/*" 404 "*) ;;
              *)
                echo "Could not verify whether $label exists" >&2
                exit 1
                ;;
            esac
          }
          check_absent "repos/$REPOSITORY/git/ref/tags/$tag" "Tag $tag"
          check_absent "repos/$REPOSITORY/releases/tags/$tag" "Release $tag"

  build:
    name: Build, sign, and seal candidate
    needs: preflight
    runs-on:
      group: gusto-ubuntu-default
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4, pinned to the SHA on Gusto's org Actions allowlist
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2, pinned to the SHA on Gusto's org Actions allowlist
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile

      - name: Validate exact source and release intent
        id: intent
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          checked_out=$(git rev-parse HEAD)
          if [[ "$checked_out" != "$COMMIT_SHA" ]]; then
            echo "Checkout did not resolve to commit_sha" >&2
            exit 1
          fi
          package_version=$(bun --print "require('./package.json').version")
          if [[ "$package_version" != "$RELEASE_VERSION" ]]; then
            echo "version does not match package.json at commit_sha" >&2
            exit 1
          fi

          base_sha=$(git rev-parse "$COMMIT_SHA^")
          subject=$(git show -s --format=%s "$COMMIT_SHA")
          case "$subject" in
            "chore: refresh release "*)
              intent_json=$(RELEASE_INTENT_CONTEXT=post-merge bun scripts/release-intent.ts refresh \
                --base "$base_sha" --head "$COMMIT_SHA" --version "$RELEASE_VERSION" --json)
              ;;
            *)
              intent_json=$(bun scripts/release-intent.ts push \
                --base "$base_sha" --head "$COMMIT_SHA" --json)
              ;;
          esac

          release_notes_sha256=$(
            INTENT_JSON="$intent_json" EXPECTED_VERSION="$RELEASE_VERSION" EXPECTED_SHA="$COMMIT_SHA" bun --print '
              const intent = JSON.parse(process.env.INTENT_JSON);
              if (intent.kind !== "release" && intent.kind !== "refresh") throw new Error("Commit has no release intent");
              if (intent.version !== process.env.EXPECTED_VERSION) throw new Error("Release intent version mismatch");
              if (intent.commitSha !== process.env.EXPECTED_SHA) throw new Error("Release intent commit mismatch");
              if (!/^[0-9a-f]{64}$/.test(intent.releaseNotesSha256)) throw new Error("Invalid release-notes hash");
              intent.releaseNotesSha256;
            '
          )
          printf 'release_notes_sha256=%s\n' "$release_notes_sha256" >> "$GITHUB_OUTPUT"

          tag="v$RELEASE_VERSION"
          check_absent() {
            endpoint=$1
            label=$2
            response=""
            if response=$(gh api --include --silent "$endpoint"); then
              echo "$label already exists" >&2
              exit 1
            fi
            case "$response" in
              HTTP/*" 404 "*) ;;
              *)
                echo "Could not verify whether $label exists" >&2
                exit 1
                ;;
            esac
          }
          check_absent "repos/$REPOSITORY/git/ref/tags/$tag" "Tag $tag"
          check_absent "repos/$REPOSITORY/releases/tags/$tag" "Release $tag"

      - name: Build binaries
        env:
          BUN_NO_CODESIGN_MACHO_BINARY: "1"
        run: bun run build:all

      - name: Revalidate source eligibility before signing
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          resolved=$(gh api "repos/$REPOSITORY/commits/$COMMIT_SHA" --jq .sha)
          if [[ "$resolved" != "$COMMIT_SHA" ]]; then
            echo "commit_sha did not resolve to the supplied commit" >&2
            exit 1
          fi
          default_branch=$(gh api "repos/$REPOSITORY" --jq .default_branch)
          if [[ "$default_branch" != "main" ]]; then
            echo "The repository default branch must be main" >&2
            exit 1
          fi
          ancestry=$(gh api "repos/$REPOSITORY/compare/$COMMIT_SHA...$default_branch" --jq .status)
          if [[ "$ancestry" != "ahead" && "$ancestry" != "identical" ]]; then
            echo "commit_sha must still be reachable from main" >&2
            exit 1
          fi

          ci_runs="$RUNNER_TEMP/pre-sign-ci-runs.json"
          gh api --paginate --slurp --method GET "repos/$REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$COMMIT_SHA" -f event=push -f status=success -f per_page=100 > "$ci_runs"
          if ! jq -e --arg sha "$COMMIT_SHA" '
            [.[] | .workflow_runs[] |
              select(.head_sha == $sha and .event == "push" and .status == "completed" and .conclusion == "success")]
            | length > 0
          ' "$ci_runs" >/dev/null; then
            echo "No successful push CI run exists for commit_sha" >&2
            exit 1
          fi

          tag="v$RELEASE_VERSION"
          check_absent() {
            endpoint=$1
            label=$2
            response=""
            if response=$(gh api --include --silent "$endpoint"); then
              echo "$label already exists" >&2
              exit 1
            fi
            case "$response" in
              HTTP/*" 404 "*) ;;
              *)
                echo "Could not verify whether $label exists" >&2
                exit 1
                ;;
            esac
          }
          check_absent "repos/$REPOSITORY/git/ref/tags/$tag" "Tag $tag"
          check_absent "repos/$REPOSITORY/releases/tags/$tag" "Release $tag"

      - name: Sign and notarize macOS binaries
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail

          : "${MACOS_CERT_P12_BASE64:?must be set as a repo secret}"
          : "${MACOS_CERT_PASSWORD:?must be set as a repo secret}"
          : "${ASC_KEY_ID:?must be set as a repo secret}"
          : "${ASC_ISSUER_ID:?must be set as a repo secret}"
          : "${ASC_API_KEY_P8:?must be set as a repo secret}"

          rcodesign_version=0.29.0
          rcodesign_sha256=dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002
          asset="apple-codesign-${rcodesign_version}-x86_64-unknown-linux-musl"

          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT

          curl -fsSL -o "$work/rcodesign.tar.gz" \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${rcodesign_version}/${asset}.tar.gz"
          echo "${rcodesign_sha256}  ${work}/rcodesign.tar.gz" | sha256sum -c -
          tar -xzf "$work/rcodesign.tar.gz" -C "$work"
          rcodesign="$work/$asset/rcodesign"

          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 -d > "$work/signing.p12"
          printf '%s' "$MACOS_CERT_PASSWORD" > "$work/p12-pass"
          printf '%s' "$ASC_API_KEY_P8" > "$work/asc.p8"
          "$rcodesign" encode-app-store-connect-api-key \
            "$ASC_ISSUER_ID" "$ASC_KEY_ID" "$work/asc.p8" > "$work/asc-key.json"

          for bin in dist/gusto-darwin-arm64 dist/gusto-darwin-x64; do
            "$rcodesign" sign \
              --p12-file "$work/signing.p12" --p12-password-file "$work/p12-pass" \
              --code-signature-flags runtime "$bin"
            zip -j "$work/$(basename "$bin").zip" "$bin"
            "$rcodesign" notary-submit --api-key-file "$work/asc-key.json" \
              --wait "$work/$(basename "$bin").zip"
            "$rcodesign" verify "$bin"
          done

      - name: Seal exact candidate bytes
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          RELEASE_NOTES_SHA256: ${{ steps.intent.outputs.release_notes_sha256 }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          mkdir release-candidate
          sha256sum dist/gusto-darwin-arm64 dist/gusto-darwin-x64 dist/gusto-linux-x64 \
            | sed 's#  dist/#  #' > release-candidate/SHA256SUMS
          install -m 0755 dist/gusto-darwin-arm64 dist/gusto-darwin-x64 dist/gusto-linux-x64 release-candidate/
          bun scripts/release-intent.ts extract-notes \
            --sha "$COMMIT_SHA" --version "$RELEASE_VERSION" --output release-candidate/release-notes.md
          bun scripts/release-manifest.ts create \
            --directory release-candidate \
            --version "$RELEASE_VERSION" \
            --commit-sha "$COMMIT_SHA" \
            --release-notes-sha256 "$RELEASE_NOTES_SHA256"
          bun scripts/release-manifest.ts verify \
            --directory release-candidate \
            --version "$RELEASE_VERSION" \
            --commit-sha "$COMMIT_SHA" \
            --release-notes-sha256 "$RELEASE_NOTES_SHA256"

      - name: Upload sealed candidate
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ inputs.version }}-${{ inputs.commit_sha }}
          path: release-candidate/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Record publisher inputs
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          CANDIDATE_RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          RELEASE_NOTES_SHA256: ${{ steps.intent.outputs.release_notes_sha256 }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          {
            printf 'version: `%s`\n' "$RELEASE_VERSION"
            printf 'commit_sha: `%s`\n' "$COMMIT_SHA"
            printf 'candidate_run_id: `%s`\n' "$CANDIDATE_RUN_ID"
            printf 'artifact_id: `%s`\n' "$ARTIFACT_ID"
            printf 'artifact_digest: `%s`\n' "$ARTIFACT_DIGEST"
            printf 'release_notes_sha256: `%s`\n' "$RELEASE_NOTES_SHA256"
          } >> "$GITHUB_STEP_SUMMARY"

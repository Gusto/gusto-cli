name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

# Lock down the default GITHUB_TOKEN (mirrors Gusto/embedded-react-sdk).
permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  # Safe on the internal runner: git archive only packages source, it does not
  # execute PR code. The untrusted bun install runs on a hosted runner (see check).
  # Hosted runners can't do this step themselves: their IPs aren't on the org
  # allowlist, so actions/checkout 403s there. Hand the source off via artifact.
  # fetch-depth: 0 is required so the full commit history is available when
  # building the git bundle for the dco job (see dco).
  package:
    name: Package source
    runs-on:
      group: gusto-ubuntu-default
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4, pinned to the SHA on Gusto's org Actions allowlist
        with:
          fetch-depth: 0
      # Archive the full tracked tree (not a path subset): check needs the root
      # configs (tsconfig.json, eslint.config.mjs, .prettierrc.json, bunfig.toml)
      # that typecheck/lint/format/test read. Excludes .git, which no downstream
      # job needs (test:dco builds its own temp repos; install-hooks.sh exits 0
      # when .git is absent).
      - name: Package source for hosted jobs
        run: git archive --format=tar.gz -o cli-source.tar.gz HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-source
          path: cli-source.tar.gz
          if-no-files-found: error
          retention-days: 1
      # Bundle the full git history so the dco job can verify commit sign-offs
      # on a hosted runner without needing actions/checkout (which 403s on hosted
      # runners while the repo is on the org IP allowlist). Include tag refs so
      # release intent can resolve the exact annotated or lightweight baseline.
      - name: Create git bundle for DCO check
        if: github.event_name == 'pull_request'
        run: git bundle create pr-history.bundle HEAD --tags
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          name: pr-history
          path: pr-history.bundle
          if-no-files-found: error
          retention-days: 1

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    # Hosted runner: this job runs the PR's own scripts/check-dco.sh, so a fork
    # PR could otherwise execute attacker code on the internal runner group.
    # Source arrives via git bundle from the package job (see package) rather
    # than actions/checkout, which 403s on hosted runners while the repo is on
    # the org IP allowlist.
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-history
      - name: Restore git repository from bundle
        run: git clone pr-history.bundle workdir
      - name: Verify Signed-off-by on every commit
        working-directory: workdir
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-dco.sh

  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    # This runs the PR's validator, so use a hosted runner and the source
    # artifact rather than the internal runner group.
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-source
      - run: tar -xzf cli-source.tar.gz
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2, pinned to the SHA on Gusto's org Actions allowlist
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          message_file=$(mktemp)
          trap 'rm -f "$message_file"' EXIT
          printf '%s\n' "$PR_TITLE" > "$message_file"
          sh scripts/check-commit-message.sh "$message_file"

  release-intent:
    name: Release intent
    if: github.event_name == 'pull_request'
    # This job executes the PR's validator and installs its dependencies, so it
    # must stay on a hosted runner. The source and full history arrive through
    # artifacts produced by package; untrusted PR code never runs internally.
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-source
          path: source
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-history
      - name: Restore source and full history
        run: |
          git clone pr-history.bundle workdir
          tar -xzf source/cli-source.tar.gz -C workdir
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2, pinned to the SHA on Gusto's org Actions allowlist
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        working-directory: workdir
        run: bun install --frozen-lockfile
      - name: Validate release or refresh intent
        working-directory: workdir
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu

          subject=$(git show -s --format=%s "$HEAD_SHA")
          case "$subject" in
            "chore: refresh release" | "chore: refresh release "*)
              version=${subject#chore: refresh release }
              intent_json=$(RELEASE_INTENT_CONTEXT=pr bun scripts/release-intent.ts refresh \
                --base "$BASE_SHA" --head "$HEAD_SHA" --version "$version" --json)
              ;;
            *)
              intent_json=$(bun scripts/release-intent.ts push --base "$BASE_SHA" --head "$HEAD_SHA" --json)
              ;;
          esac

          kind=$(INTENT_JSON="$intent_json" bun --print 'JSON.parse(process.env.INTENT_JSON).kind')
          if [ "$kind" = "none" ]; then
            exit 0
          fi
          version=$(INTENT_JSON="$intent_json" bun --print 'JSON.parse(process.env.INTENT_JSON).version')
          tag="v$version"

          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Tag $tag already exists" >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "Could not verify whether tag $tag exists locally" >&2
              exit 1
            fi
          fi

          check_api_absent() {
            endpoint=$1
            label=$2
            response=""
            if response=$(gh api --include --silent "$endpoint"); then
              echo "$label already exists" >&2
              exit 1
            fi
            case "$response" in
              HTTP/*" 404 "*) ;;
              *)
                echo "Could not verify whether $label exists" >&2
                exit 1
                ;;
            esac
          }

          check_api_absent "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" "tag $tag"
          check_api_absent "repos/$GITHUB_REPOSITORY/releases/tags/$tag" "Release $tag"

  # Runs untrusted PR code (bun install can execute dependency postinstall scripts),
  # so it must stay on a hosted runner, never the internal runner group. Source
  # arrives via the package artifact rather than actions/checkout (see package).
  check:
    name: Lint + Typecheck + Format + Unit & install tests
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-source
      - run: tar -xzf cli-source.tar.gz
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2, pinned to the SHA on Gusto's org Actions allowlist
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: bun run test:release
      - run: bun run test:install
      - run: bun run test:dco
      - run: bun run license:check

  smoke:
    name: Smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [package, check]
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel covers x86_64 darwin (macos-14 is arm64); macos-13 runners were retired.
        os: [ubuntu-latest, macos-14, macos-15-intel]
    steps:
      # No checkout: these runners 403 on github.com (see `package`). Source via artifact.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-source
      - run: tar -xzf cli-source.tar.gz
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2, pinned to the SHA on Gusto's org Actions allowlist
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run test:smoke

  build:
    name: Build all platform binaries
    # Runs untrusted PR code (bun install), so hosted runner + artifact source, not
    # the internal runner group. Consumes the package artifact (see package).
    runs-on: ubuntu-latest
    # Gate on check too so smoke/build don't burn runners when lint/tests fail.
    needs: [package, check]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-source
      - run: tar -xzf cli-source.tar.gz
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2, pinned to the SHA on Gusto's org Actions allowlist
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build:all
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gusto-cli-binaries
          path: dist/gusto-*
          if-no-files-found: error
          retention-days: 7

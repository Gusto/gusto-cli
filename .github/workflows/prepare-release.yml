name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional stable version override
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  BUN_VERSION: 1.3.14

jobs:
  prepare:
    name: Prepare release pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4, pinned to the SHA on Gusto's org Actions allowlist
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2, pinned to the SHA on Gusto's org Actions allowlist
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      - name: Configure release commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare release files
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          args=()
          if [[ -n "$RELEASE_VERSION" ]]; then
            args+=(--version "$RELEASE_VERSION")
          fi
          bun run release:prepare "${args[@]}"

      - name: Push release branch
        run: git push --set-upstream origin "$(git branch --show-current)"

      - name: Open draft release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(bun --print "require('./package.json').version")"
          branch="$(git branch --show-current)"
          gh pr create --draft --base main --head "$branch" \
            --title "chore: release $version" \
            --body-file .github/pull_request_template.md
